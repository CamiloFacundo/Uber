<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding auth">
  <div class="logo-cabecera"><app-logo [alto]="36"></app-logo></div>

  <form [formGroup]="form" (ngSubmit)="registrar()">
    <p>¿Cómo vas a usar la app?</p>
    <ion-segment formControlName="role">
      <ion-segment-button value="client"><ion-label>Pasajero</ion-label></ion-segment-button>
      <ion-segment-button value="driver"><ion-label>Conductor</ion-label></ion-segment-button>
    </ion-segment>

    <ion-list>
      <ion-item>
        <ion-input label="Nombre completo" labelPlacement="floating" formControlName="name" errorText="Obligatorio"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Correo" labelPlacement="floating" type="email" formControlName="email" errorText="Correo no válido"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Teléfono" labelPlacement="floating" type="tel" formControlName="phone" errorText="Entre 7 y 10 dígitos"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Contraseña" labelPlacement="floating" type="password" formControlName="password" errorText="Mínimo 8 caracteres"></ion-input>
      </ion-item>
    </ion-list>

    @if (esConductor()) {
      <ion-list>
        <ion-list-header>Licencia y vehículo</ion-list-header>
        <ion-segment formControlName="vehicle_type" class="tipo-vehiculo" aria-label="Tipo de vehículo">
          <ion-segment-button value="car"><ion-label>AUREN Car</ion-label></ion-segment-button>
          <ion-segment-button value="moto"><ion-label>AUREN Moto</ion-label></ion-segment-button>
        </ion-segment>
        <ion-item>
          <ion-input label="Número de licencia" labelPlacement="floating" formControlName="license_number"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Placa" labelPlacement="floating" formControlName="plate" placeholder="ABC-123"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Marca" labelPlacement="floating" formControlName="brand"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Modelo" labelPlacement="floating" formControlName="model"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Año" labelPlacement="floating" type="number" formControlName="year"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Capacidad (pasajeros)" labelPlacement="floating" type="number" formControlName="capacity"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Color" labelPlacement="floating" formControlName="color"></ion-input>
        </ion-item>
      </ion-list>
    }

    <ion-button type="submit" expand="block" color="secondary" [disabled]="cargando()">
      @if (cargando()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Registrarme
      }
    </ion-button>
  </form>
</ion-content>
